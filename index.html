<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Voice AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e5e7eb;font-family:system-ui,Arial}.app{max-width:800px;margin:auto;min-height:100vh;padding:14px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:21px;margin:5px 0}.badge{font-size:12px;color:#93c5fd}.panel{background:#111d31;border:1px solid #26364e;border-radius:14px;padding:10px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;color:#aab7ca}select,textarea{width:100%;border:0;border-radius:10px;padding:11px;font:inherit}textarea{resize:vertical;min-height:55px}.chat{flex:1;overflow:auto;padding:4px 0}.msg{white-space:pre-wrap;line-height:1.48;max-width:92%;padding:11px 13px;margin:9px 0;border-radius:14px}.user{background:#2563eb;margin-left:auto}.bot{background:#172338}.status{color:#9fb0c7;font-size:12px;min-height:21px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px}.btn{border:0;border-radius:10px;padding:10px 13px;color:#fff;background:#334155;font-weight:700}.primary{background:#16a34a}.danger{background:#b91c1c}.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.note{color:#8da0b9;font-size:11px;line-height:1.4;margin-top:9px}@media(max-width:520px){.panel{grid-template-columns:1fr}.bar{grid-template-columns:1fr auto}.bar .send{grid-column:1/3;height:44px}}
</style>
</head>
<body><main class="app"><header><h1>🎙️ Local Voice AI</h1><span id="badge" class="badge">AI not loaded</span></header><section class="panel"><label>AI model<select id="model"><option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Better accuracy (~4-5 min)</option></select></label><label>Voice language<select id="lang"><option value="auto">Auto / mixed</option><option value="pa-IN">Punjabi</option><option value="hi-IN">Hindi</option><option value="en-IN">English</option></select></label><button id="load" class="btn primary">Load local AI</button><button id="test" class="btn">Test microphone</button></section><section id="chat" class="chat"><div class="msg bot">Load local AI dabao. Model ready hon ton baad apna sawaal text jaan mic naal pucho.</div></section><div id="status" class="status">Ready</div><section class="bar"><textarea id="input" placeholder="Sawaal likho... (Enter = send, Shift+Enter = new line)"></textarea><button id="mic" class="btn">🎤</button><button id="send" class="btn primary send">Send</button></section><div class="tools"><button id="read" class="btn">🔊 Read last</button><button id="stop" class="btn danger">⏹ Stop</button><button id="clear" class="btn">🗑 Clear</button></div><p class="note">No API key. Pehli vaar model download hovega. WebGPU browser support zaroori hai. Mobile mic layi localhost/HTTPS te permission Allow karo.</p></main>
<script type="module">
import{CreateMLCEngine,prebuiltAppConfig}from'https://esm.run/@mlc-ai/web-llm';
const $=x=>document.getElementById(x),chat=$('chat'),input=$('input'),status=$('status'),lang=$('lang');let engine=null,last='';
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(c==='bot')last=t}
function language(){let l=lang.value;return l==='pa-IN'?'Punjabi (Gurmukhi or Roman Punjabi)':l==='hi-IN'?'Hindi':'the same language used by the user. If the user uses Roman Punjabi, answer in Roman Punjabi.'}
async function load(){const b=$('load');b.disabled=true;try{status.textContent='Loading local model...';if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}engine=await CreateMLCEngine($('model').value,{initProgressCallback:p=>status.textContent='Downloading model: '+Math.round(p.progress*100)+'%',appConfig:{...prebuiltAppConfig,cacheBackend:'indexeddb'}});$('badge').textContent='AI ready';status.textContent='AI ready';b.textContent='AI loaded'}catch(e){status.textContent='AI load failed: '+e.message;b.disabled=false}}
async function send(text=input.value,viaVoice=false){text=text.trim();if(!text)return;if(!engine){status.textContent='Pehla Load local AI dabao';return}add(text,'user');input.value='';status.textContent='Thinking...';let reply='';try{const stream=await engine.chat.completions.create({messages:[{role:'system',content:'You are a helpful multilingual assistant. Answer accurately and directly. Reply in '+language()+'. Do not say you are a demo. Do not give a generic greeting unless the user greeted you. Explain steps clearly. User language has priority.'},{role:'user',content:text}],temperature:.35,max_tokens:450,stream:true});for await(const part of stream){reply+=part.choices?.[0]?.delta?.content||'';const lastEl=chat.lastElementChild;if(lastEl?.classList.contains('bot'))lastEl.textContent=reply;else add(reply,'bot');chat.scrollTop=chat.scrollHeight}last=reply;status.textContent='Ready';if(viaVoice)speak()}catch(e){status.textContent='Answer error: '+e.message;add('AI error: '+e.message,'bot')}}
function detectLang(){if(lang.value!=='auto')return lang.value;const t=input.value;if(/[\u0A00-\u0A7F]/.test(t))return'pa-IN';if(/[\u0900-\u097F]/.test(t))return'hi-IN';return'en-IN'}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='This browser does not support speech recognition. Use text input or latest Chrome/Safari.';return}const r=new SR();r.lang=detectLang();r.continuous=false;r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>status.textContent='Listening...';r.onresult=e=>{const t=e.results[0][0].transcript;input.value=t;status.textContent='Voice received';send(t,true)};r.onerror=e=>status.textContent='Mic error: '+e.error+'. Permission and HTTPS/localhost check karo.';r.onend=()=>{if(status.textContent==='Listening...')status.textContent='Ready'};try{r.start()}catch(e){status.textContent='Mic already active'}}
function speak(){if(!last)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(last);u.lang=lang.value==='auto'?detectLang():lang.value;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2)))||null;speechSynthesis.speak(u)}
$('load').onclick=load;$('send').onclick=()=>send();$('mic').onclick=mic;$('test').onclick=mic;$('read').onclick=speak;$('stop').onclick=()=>speechSynthesis.cancel();$('clear').onclick=()=>{chat.innerHTML='';last='';add('Chat clear ho gayi.','bot')};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});speechSynthesis.onvoiceschanged=()=>{};
</script></body></html>
