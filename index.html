<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fast AI Voice Caller</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#020617;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px}
.app{width:100%;max-width:430px;background:#0f172a;border:1px solid #263244;border-radius:28px;padding:22px;box-shadow:0 20px 60px #0008}
h1{text-align:center;font-size:22px;margin:0 0 8px}.hint{text-align:center;color:#94a3b8;font-size:12px;margin-bottom:22px}
.avatar{width:110px;height:110px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 0 40px #2563eb66}
.active{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 18px #2563eb18,0 0 55px #2563eb88}}
#status{text-align:center;color:#60a5fa;font-weight:700;font-size:17px;min-height:25px}
#sub{text-align:center;color:#64748b;font-size:12px;min-height:20px;margin:4px 0 15px}
.langs{display:flex;gap:7px;margin-bottom:12px}.lang{flex:1;padding:10px;border:1px solid #334155;border-radius:10px;background:#1e293b;color:#cbd5e1}.lang.sel{border-color:#60a5fa;color:#60a5fa;background:#172554}
#log{height:260px;overflow:auto;background:#020617;border-radius:16px;padding:12px;margin-bottom:14px}.msg{padding:10px 12px;margin:7px 0;border-radius:13px;font-size:13px;line-height:1.45;word-break:break-word}.you{background:#1d4ed8;margin-left:18%}.ai{background:#1e293b;margin-right:18%}.sys{text-align:center;color:#64748b;font-size:11px}
.row{display:flex;gap:10px}button{cursor:pointer;font:inherit}.main{flex:1;border:0;border-radius:16px;padding:16px;color:#fff;font-weight:700;background:#2563eb}.main.end{background:#dc2626}.clear{width:55px;border:1px solid #334155;border-radius:16px;background:#1e293b;color:#fff}
.note{font-size:10px;text-align:center;color:#475569;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<h1>🤖 Fast AI Voice Caller</h1>
<div class="hint">Browser AI voice assistant</div>
<div id="avatar" class="avatar">🤖</div>
<div id="status">Ready</div>
<div id="sub">Tap Start and allow microphone access</div>

<div class="langs">
<button class="lang sel" data-l="en-IN">English</button>
<button class="lang" data-l="pa-IN">ਪੰਜਾਬੀ</button>
<button class="lang" data-l="hi-IN">हिन्दी</button>
</div>

<div id="log"><div class="msg sys">Press Start Call to begin.</div></div>

<div class="row">
<button id="main" class="main">🎙️ Start Call</button>
<button id="clear" class="clear">🗑️</button>
</div>
<div class="note">Best results: Chrome + HTTPS/localhost</div>
</div>

<script>
const main=document.getElementById("main"),clear=document.getElementById("clear");
const status=document.getElementById("status"),sub=document.getElementById("sub");
const log=document.getElementById("log"),avatar=document.getElementById("avatar");
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const synth=window.speechSynthesis;

let rec=null,stream=null,active=false,speaking=false,thinking=false;
let lang="en-IN",requestNo=0,history=[];

function add(type,text){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.textContent=text;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

function setStatus(a,b){
  status.textContent=a; sub.textContent=b;
}

function setup(){
  if(!SpeechRecognition){
    setStatus("Not supported","Use Google Chrome");
    main.disabled=true; return false;
  }
  rec=new SpeechRecognition();
  rec.lang=lang;
  rec.continuous=false;
  rec.interimResults=false;
  rec.maxAlternatives=1;

  rec.onstart=()=>{ if(active&&!speaking&&!thinking)setStatus("Listening...","Speak now"); };

  rec.onresult=async e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal) continue;
      const text=e.results[i][0].transcript.trim();
      if(!text) continue;
      const low=text.toLowerCase();

      if(/^(stop|ruk|ruko|chup|bas|cancel|pause)$/.test(low) ||
         /^(stop|ruk|ruko|chup|bas|cancel|pause)\s/.test(low)){
        interrupt(); continue;
      }

      if(speaking) stopSpeech();
      add("you","You: "+text);
      history.push({role:"user",content:text});
      askAI();
    }
  };

  rec.onerror=e=>{
    console.log("Recognition:",e.error);
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      setStatus("Microphone blocked","Allow microphone permission in Chrome");
      add("sys","Microphone permission was denied.");
      end(false);
    } else if(e.error==="audio-capture"){
      setStatus("Microphone unavailable","Check your phone microphone");
    }
  };

  rec.onend=()=>{
    if(active && !speaking && !thinking){
      setTimeout(startRec,500);
    }
  };
  return true;
}

function startRec(){
  if(!active||speaking||thinking||!rec)return;
  try{rec.start()}catch(e){}
}

async function getMic(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("Microphone API unavailable. Open this page in Chrome over HTTPS or localhost.");
  }
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  return true;
}

async function start(){
  if(active)return;
  if(!setup())return;

  setStatus("Requesting microphone...","Please tap Allow if Chrome asks");
  try{
    await getMic();
  }catch(e){
    console.error(e);
    setStatus("Microphone permission needed","Allow microphone access, then tap Start again");
    add("sys","Could not access microphone. "+e.message);
    return;
  }

  active=true;
  main.textContent="📞 End Call";
  main.classList.add("end");
  avatar.classList.add("active");
  add("sys","Call started. I'm listening.");
  setStatus("Listening...","Speak now");
  startRec();
}

function end(message=true){
  active=false; requestNo++; thinking=false;
  stopSpeech();
  if(rec)try{rec.stop()}catch(e){}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  main.textContent="🎙️ Start Call";main.classList.remove("end");
  avatar.classList.remove("active");
  setStatus("Call ended","Tap Start to talk again");
  if(message)add("sys","Call ended.");
}

function stopSpeech(){
  synth.cancel(); speaking=false; avatar.classList.remove("active");
}

function interrupt(){
  requestNo++; thinking=false; stopSpeech();
  add("sys","Interrupted. Listening again.");
  if(active){setStatus("Listening...","Speak now");startRec();}
}

async function askAI(){
  if(!active)return;
  thinking=true; const id=++requestNo;
  setTimeout(()=>{},0);
  setStatus("Thinking...","AI is preparing a reply");
  try{
    const msgs=[
      {role:"system",content:`You are a friendly voice assistant. Reply briefly and naturally for speech. Current language: ${lang==="pa-IN"?"Punjabi":lang==="hi-IN"?"Hindi":"English"}. Do not use markdown.`},
      ...history.slice(-10)
    ];
    const r=await Promise.race([puter.ai.chat(msgs,{model:"gpt-5.6-luna",normalize:true}),new Promise((_,reject)=>setTimeout(()=>reject(new Error("AI request timed out after 25 seconds")),25000))]);
    if(!active||id!==requestNo)return;
    const text=typeof r==="string"?r:(r?.message?.content||r?.content||"Okay.");
    history.push({role:"assistant",content:text});
    add("ai","AI: "+text);
    thinking=false;
    speak(text);
  }catch(e){
    console.error("Puter:",e);
    if(active&&id===requestNo){
      thinking=false;
      add("ai","AI: Sorry, I couldn't connect right now.");
      setStatus("Listening...","Speak again");
      startRec();
    }
  }
}

function speak(text){
  if(!active)return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;u.rate=1.05;u.pitch=1;
  const voices=synth.getVoices();
  const v=voices.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
  if(v)u.voice=v;
  u.onstart=()=>{speaking=true;avatar.classList.add("active");setStatus("Speaking...","Say Stop to interrupt");};
  u.onend=()=>{speaking=false;avatar.classList.remove("active");if(active){setStatus("Listening...","Speak now");startRec();}};
  u.onerror=()=>{speaking=false;avatar.classList.remove("active");if(active)startRec();};
  synth.speak(u);
}

main.onclick=()=>active?end():start();

clear.onclick=()=>{
  history=[];
  log.innerHTML='<div class="msg sys">Conversation cleared.</div>';
};

document.querySelectorAll(".lang").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".lang").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
    lang=b.dataset.l;
    if(rec)rec.lang=lang;
    add("sys","Language changed.");
  };
});

if("onvoiceschanged" in synth)synth.onvoiceschanged=()=>synth.getVoices();

if(!SpeechRecognition){
  setStatus("Chrome required","Speech recognition is not supported here");
}
</script>
</body>
</html>
